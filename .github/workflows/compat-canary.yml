name: compatibility canary

# Scheduled compatibility check for the DSH release this repository pins.
# It runs the strict bundle and index validators outside PRs, so a scheduled
# run surfaces drift in the pinned release or the validators. Move DSH_VERSION
# first when changing the supported runtime.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_VERSION: "0.2.2-rc.1"

jobs:
  pinned:
    name: Pinned DSH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install and verify the pinned DSH
        run: |
          npm install --global "@deepseek-ai/dsh@${DSH_VERSION}"
          installed="$(dsh --version)"
          if [ "$installed" != "$DSH_VERSION" ]; then
            echo "::error::expected DSH ${DSH_VERSION}, got ${installed}"
            exit 1
          fi

      - name: Validate bundles against the pinned DSH
        run: node scripts/validate-bundles.mjs --strict --dsh-root "$(npm root -g)/@deepseek-ai"

      - name: Validate the plugin index against the pinned DSH
        run: node scripts/validate-market-index.mjs --dsh-root "$(npm root -g)/@deepseek-ai"
