name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Skills and bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The validators resolve `yaml` and `semver` from the DSH installation, so
      # the repository itself stays dependency-free.
      - name: Install the pinned DSH
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.2

      - name: Validate skills
        run: node scripts/validate-skills.mjs

      - name: Validate bundles
        run: node scripts/validate-bundles.mjs --dsh-root "$(npm root -g)/@deepseek-ai"

      - name: Validate GitHub install metadata
        run: node scripts/validate-github-install.mjs --strict
