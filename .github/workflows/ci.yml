name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets a maintainer validate a generated pull request branch, whose CI does
  # not run automatically when the release workflow opened it with the
  # repository token.
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_VERSION: ${{ vars.DSH_VERSION }}

jobs:
  validate:
    name: Skills, bundles, and plugin index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plugin index validator reads release tags and the commits they
          # pin, so the checkout needs the full history and tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The validators resolve `yaml`, `semver`, and the plugin market index
      # validator from the DSH installation, so the repository itself stays
      # dependency-free.
      - name: Install and verify the pinned DSH
        run: |
          npm install --global "@deepseek-ai/dsh@${DSH_VERSION}"
          installed="$(dsh --version)"
          if [ "$installed" != "$DSH_VERSION" ]; then
            echo "::error::expected DSH ${DSH_VERSION}, got ${installed}"
            exit 1
          fi

      - name: Validate skills
        run: node scripts/validate-skills.mjs

      - name: Validate bundles
        run: node scripts/validate-bundles.mjs --dsh-root "$(npm root -g)/@deepseek-ai"

      - name: Validate GitHub install metadata
        run: node scripts/validate-github-install.mjs --strict

      - name: Validate the plugin market index
        run: node scripts/validate-market-index.mjs --dsh-root "$(npm root -g)/@deepseek-ai"

      # A plugin may need a build (the forked superagent does); the committed
      # build output is what a Git install ships, so the lockfile is installed
      # and the build is re-run to prove the checked-in output is current.
      - name: Install plugin build toolchains
        run: |
          # The superagent fork pins pnpm through packageManager; install that
          # version explicitly rather than depending on a corepack shim.
          npm install --global pnpm@11.7.0
          for lockfile in plugins/*/pnpm-lock.yaml; do
            [ -f "$lockfile" ] || continue
            directory="$(dirname "$lockfile")"
            echo "installing $directory"
            (cd "$directory" && pnpm install --frozen-lockfile) || exit 1
          done

      - name: Check committed build output is current
        run: |
          for manifest in plugins/*/package.json; do
            directory="$(dirname "$manifest")"
            if [ ! -f "$directory/pnpm-lock.yaml" ]; then continue; fi
            if ! node -e "process.exit(require('./${manifest}').scripts?.build ? 0 : 1)"; then continue; fi
            echo "building $directory"
            (cd "$directory" && pnpm run build) || exit 1
            if ! git diff --exit-code -- "$directory"; then
              echo "::error::$directory has committed build output that differs from a fresh build; run pnpm build in that directory and commit the result"
              exit 1
            fi
          done

      - name: Typecheck plugin packages
        run: |
          for manifest in plugins/*/package.json; do
            directory="$(dirname "$manifest")"
            if [ ! -f "$directory/pnpm-lock.yaml" ]; then continue; fi
            if ! node -e "process.exit(require('./${manifest}').scripts?.typecheck ? 0 : 1)"; then continue; fi
            echo "typechecking $directory"
            (cd "$directory" && pnpm run typecheck) || exit 1
          done

      - name: Test plugin packages
        run: |
          for manifest in plugins/*/package.json; do
            directory="$(dirname "$manifest")"
            if ! node -e "process.exit(require('./${manifest}').scripts?.test ? 0 : 1)"; then continue; fi
            if [ -f "$directory/pnpm-lock.yaml" ]; then
              (cd "$directory" && pnpm test) || exit 1
            else
              (cd "$directory" && npm test) || exit 1
            fi
          done
