name: release

# A plugin release is one annotated tag named `<plugin>-v<version>`.
# This workflow validates that the tag matches the package version, runs the
# repository validators, creates the GitHub release, and opens a pull request
# that republishes `index.json` (the Discover plugin index) with the new version.
#
# It runs on a tag push (the manual `scripts/release-tag.mjs` path) and on a
# workflow_dispatch with `--ref <tag>`, which version-plugins.yml uses: a tag
# pushed by GITHUB_TOKEN does not start another workflow, so the versioning
# workflow dispatches this one explicitly for each new tag.
# Tagging is documented in README.md and docs/plugin-index.md.

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:

# Releases touch tags, releases and the shared index, so run them one at a time.
# A queued run sees the pull request an earlier run opened and does not duplicate it.
concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DSH_VERSION: ${{ vars.DSH_VERSION }}

jobs:
  release:
    name: Publish plugin release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The index is rebuilt from the full tag list, including this tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install and verify the pinned DSH
        run: |
          npm install --global "@deepseek-ai/dsh@${DSH_VERSION}"
          installed="$(dsh --version)"
          if [ "$installed" != "$DSH_VERSION" ]; then
            echo "::error::expected DSH ${DSH_VERSION}, got ${installed}"
            exit 1
          fi

      - name: Validate the release tag and packages
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "::error::release must run for a tag ref, not $GITHUB_REF"; exit 1 ;;
          esac
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^([a-z0-9][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::invalid release tag: $tag"
            exit 1
          fi
          plugin="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          if [ ! -f "plugins/${plugin}/package.json" ]; then
            echo "::error::plugins/${plugin}/package.json is missing"
            exit 1
          fi
          package_version="$(node -e 'const m = require(process.argv[1]); process.stdout.write(m.version)' "$PWD/plugins/${plugin}/package.json")"
          if [ "$package_version" != "$version" ]; then
            echo "::error::tag ${tag} does not match plugins/${plugin}/package.json version ${package_version}"
            exit 1
          fi
          {
            echo "TAG=${tag}"
            echo "PLUGIN=${plugin}"
            echo "VERSION=${version}"
          } >> "$GITHUB_ENV"
          node scripts/validate-github-install.mjs --strict --tag "$tag"
          node scripts/validate-skills.mjs
          node scripts/validate-bundles.mjs --dsh-root "$(npm root -g)/@deepseek-ai"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          spec="github:sredevopsorg/dsh-plugins#${TAG}&path:/plugins/${PLUGIN}"
          dsh_range="$(node -e 'const m = require(process.argv[1]); process.stdout.write(m.engines?.dsh ?? "")' "$PWD/plugins/${PLUGIN}/package.json")"
          if [ -z "$dsh_range" ]; then dsh_range="the target DSH release"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; leaving it untouched"
            exit 0
          fi
          notes="$(printf '%s\n' \
            "This is by an automated agent, not a human." \
            "" \
            "Install ${PLUGIN} ${VERSION} into a DSH profile:" \
            "" \
            "  dsh plugin --profile web add \"${spec}\"" \
            "" \
            "Or add this repository's plugin index under Plugins -> Discover -> Add index source, then install the version from the card:" \
            "" \
            "  https://raw.githubusercontent.com/sredevopsorg/dsh-plugins/main/index.json" \
            "" \
            "The same spec works with plugin_manager install_bundle." \
            "" \
            "Requires DSH ${dsh_range}, Git, and pnpm 9 or newer." \
            "" \
            "See https://github.com/sredevopsorg/dsh-plugins/blob/main/plugins/${PLUGIN}/README.md")"
          gh release create "$TAG" --verify-tag --title "${PLUGIN} ${VERSION}" --notes "$notes"

      - name: Publish the plugin index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-market-index.mjs
          node scripts/validate-market-index.mjs --strict --dsh-root "$(npm root -g)/@deepseek-ai"
          if git diff --quiet -- index.json; then
            echo "index.json already lists ${TAG}; nothing to publish"
            exit 0
          fi
          # A queued release run may find the same index already published by the
          # pull request an earlier release opened; do not open a duplicate.
          while IFS= read -r existing; do
            [ -n "$existing" ] || continue
            if git fetch --quiet --depth=1 origin "refs/heads/${existing}" >/dev/null 2>&1 \
              && git show FETCH_HEAD:index.json | cmp -s - index.json; then
              echo "branch ${existing} already publishes this index; nothing to do"
              exit 0
            fi
          done < <(git ls-remote --heads origin 'refs/heads/market/publish-*' | sed 's#.*refs/heads/##')
          branch="market/publish-${TAG}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch ${branch} already exists; an update pull request is open"
            exit 0
          fi
          git config user.name "sredevopsorgagents"
          git config user.email "292528627+sredevopsorgagents@users.noreply.github.com"
          git switch --create "$branch"
          git add index.json
          git commit -m "chore(market): publish ${TAG} in the plugin index"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          body="$(printf '%s\n' \
            "This is by an automated agent, not a human." \
            "" \
            "Republishes index.json with the release ${TAG}, so the Web Plugins -> Discover tab lists ${PLUGIN} ${VERSION} after this merges." \
            "" \
            "Generated by \`.github/workflows/release.yml\` with \`node scripts/build-market-index.mjs\`.")"
          gh pr create --base main --head "$branch" \
            --title "chore(market): publish ${TAG} in the plugin index" \
            --body "$body"
