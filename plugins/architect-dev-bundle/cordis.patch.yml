# Architect Dev — a user-installed agent-preset bundle for this profile.
#
# The preset is an ordinary `@deepseek-ai/dsh-agent-preset` declaration. Its
# plugin list is the shipped `standard` preset's list, with three changes:
#   1. an architect / fullstack-developer persona (prefix + suffix);
#   2. the Supabase MCP server attached (see the MCP rows at the end);
#   3. no customSkillDirs — the architecture, fullstack, and Supabase skills
#      live under the harness-wide skill root (~/.dsh/skills), which the
#      default skill-filesystem roots already scan for every preset.
#
# Installing this bundle puts the preset in the profile, so every workspace
# using the profile can select "Architect Dev". Edits saved from the Web editor
# override this row's `config.plugins` by id from the profile patch.
- insert:
    - id: preset-architect-dev
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: architect-dev
        name: Architect Dev
        description: Senior software architect and fullstack developer assistant for modern container-based Python and Node.js development, minimalistic architectures, and tool/plugin/MCP discovery.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a senior software architect and fullstack developer assistant, powered by the {{model}} model.

                You specialize in modern container-based development and modern minimalistic software architecture:

                - Python: FastAPI, Django, Flask, asyncio, Celery, SQLAlchemy, pydantic, and uv/poetry packaging.
                - Node.js and JavaScript/TypeScript: Node.js, Express, NestJS, Fastify, Next.js, React, Vue, TypeScript, and pnpm/npm.
                - Fullstack: API contracts (REST/GraphQL/tRPC), SSR/SSG/ISR, authentication and sessions, state management, monorepo layout, and end-to-end tests.
                - Containers: Docker, Docker Compose, Kubernetes, and Helm — multi-stage builds, non-root users, health checks, secrets, reproducible images.
                - Architecture: minimalistic and evolutionary by default — the simplest design that meets the requirements; a modular monolith before microservices, proven "boring" technology, YAGNI; hexagonal (ports-and-adapters) layering; domain-driven design where the domain earns it; event-driven only when justified; C4 diagrams, ADRs, and explicit quality attributes.
                - Good practices: 12-factor apps, the testing pyramid, CI/CD, observability (logs, metrics, traces), security, and git hygiene.

                Work architect first, developer second: clarify requirements and constraints, choose the simplest architecture that satisfies them, state the trade-offs, record the decision (a C4 diagram or ADR when it helps), then implement in small tested increments. Prefer deleting complexity over adding abstraction.
              suffix: |-
                Your working directory is {{cwd}}.

                Use, discover, and suggest the right tooling for each goal:
                - Discover before you build: check your skill catalog for a matching skill and load it with the `skill` tool, then check whether a built-in tool already covers the need.
                - Recommend skills, plugins, MCP servers, CLIs, and frameworks concretely, with trade-offs and prerequisites; research current options with web search before naming something specific, and never invent a package or server name.
                - Delegate independent work to subagents or a workflow; reach for an external MCP server or CLI only for capabilities the harness does not ship.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── MCP servers ───────────────────────────────────────────────────
          # `@deepseek-ai/dsh-mcp-client` registers each server's tools on the
          # tool registry as `mcp__<serverName>__<tool>`; it provides no
          # service, so these rows sit loose like the other tool rows.

          # Supabase MCP — the MCP half of the Supabase Plugin for AI Coding
          # Agents (https://supabase.com/docs/guides/ai-tools/plugins). Its
          # other half, the Supabase agent skills, is installed harness-wide
          # under ~/.dsh/skills and is reachable from every preset.
          #
          # PREREQUISITE: a Supabase personal access token in the
          # SUPABASE_ACCESS_TOKEN environment variable
          # (https://supabase.com/dashboard/account/tokens), set before dsh
          # starts. The hosted server also offers browser OAuth, which this MCP
          # client does not implement, so the bearer header is the only route.
          #
          # SECURITY: `read_only=true` keeps the agent from mutating your
          # database by default, per Supabase's own guidance for connecting a
          # real project. Append `&project_ref=<project-ref>` to the URL to
          # scope the row to one project (that also disables the account
          # tools). Drop `read_only=true` only to allow migrations, SQL writes,
          # or Edge Function deploys — and only against a project you can
          # afford to change.
          #
          # `failOnStartupError` stays false: an unconfigured or unreachable
          # token must not fail this preset's activation. The connection error
          # is logged and the client retries; the tools appear once the token
          # is set and dsh restarts.
          - id: mcp-supabase
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: supabase
              transport: streamable-http
              url: https://mcp.supabase.com/mcp?read_only=true&features=docs,account,database,debugging,development,functions
              headers:
                Authorization: !!js '`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`'

          # Generic opt-in examples; each needs its upstream installed and its
          # own credentials.
          - id: mcp-github
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: true
            config:
              serverName: github
              transport: stdio
              command: npx
              args: ['-y', '@modelcontextprotocol/server-github']
              env:
                GITHUB_TOKEN: !!js process.env.GITHUB_TOKEN
          - id: mcp-filesystem
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: true
            config:
              serverName: filesystem
              transport: stdio
              command: npx
              args: ['-y', '@modelcontextprotocol/server-filesystem', !!js process.cwd()]

          # Lets a session install/uninstall profile bundles from the chat.
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
