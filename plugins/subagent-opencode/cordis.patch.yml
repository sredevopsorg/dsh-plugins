# OpenCode subagent: delegate one-shot tasks to the OpenCode CLI.
#
# Two rows, mirroring the official Codex subagent bundle. `subagent-opencode`
# registers a provider named `opencode` on ctx.subagents; `tool-subagent-opencode`
# exposes it to the model under a distinct tool name so it can sit beside the
# built-in `subagent` and `subagent_fork` tools.
#
# `maxDepth: provider-managed` is required: the child is out-of-process, so the
# parent cannot enforce a numeric delegation depth inside it.
#
# `permission: session` follows the delegating session's approval policy: a
# session whose policy is `never` gets a child that refuses every permission
# request, because there is no human to ask; every other session keeps the
# answer configured here. Pin it to `reject` or `allow` to stop following the
# session. This is the only permission source the child can consult, so it is
# also what makes the preset work in a `never`-approval session.
#
# `requirements` declares the OpenCode configuration this profile depends on.
# It is empty here, which keeps the zero-configuration behavior of a local
# `opencode auth login` setup; a deployment that needs enforcement adds gates,
# for example:
#
#   requirements:
#     require: [auth, credentials, model]
#     credentials: [OPENAI_API_KEY]     # names only; values are read from the parent env
#     model: openai/gpt-5-codex
#     mode: build
#
# A `require` entry that is statically missing fails the plugin load, so a
# misconfigured profile fails at startup instead of on first delegation.
#
# `install: true` is the opt-in alternative to a manual global install: when the
# configured command does not resolve, the provider installs OpenCode's platform
# package (`@opencode/cli-<platform>-<arch>`) into `installDir` and delegates to
# it. That package has no install scripts, so the install needs no build-script
# approval. It is off by default: a delegation never downloads a program unless
# the profile asked for it.
#
#   requirements:
#     install: true
#     require: [install]        # fail the run with a clear message when it cannot
#     installDir: /var/lib/dsh/opencode   # default: <profile dir>/opencode
#     installManager: npm                 # pnpm (default), npm, or none
#
# One provider per profile. A second registration of `opencode` is rejected by
# the subagent service with DUPLICATE_PROVIDER. The OpenCode preset bundle
# therefore binds its own `opencode-preset` provider and can coexist with this
# row; it does not insert a second `opencode`.
- insert:
    - id: subagent-opencode
      name: '@sredevopsorg/dsh-subagent-opencode'
      config:
        providerName: opencode
        command: opencode
        args:
          - acp
        permission: session
        requirements:
          require: []
    - id: tool-subagent-opencode
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: opencode
        toolName: subagent_opencode
        maxDepth: provider-managed
